spring.application.name=notifier
server.port=${PORT:8080}

# Remitente de los correos (debe estar verificado en Brevo)
notifier.sender.email=${SENDER_EMAIL}
notifier.sender.name=${SENDER_NAME:Gestion de Usuarios}

# Brevo (API HTTP)
brevo.api-url=${BREVO_API_URL:https://api.brevo.com}
brevo.api-key=${BREVO_API_KEY}

# Kafka (consumidor)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:notifier-group}
spring.kafka.consumer.auto-offset-reset=earliest
notifier.kafka.topics=${KAFKA_TOPICS:users.events,accounts.events}