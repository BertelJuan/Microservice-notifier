# Perfil "cloud": conexión a Kafka en Aiven (SASL_SSL).
# Se activa con SPRING_PROFILES_ACTIVE=cloud. En local sin esa variable sigue usando localhost:9092.
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}

spring.kafka.jaas.enabled=true
spring.kafka.jaas.login-module=${KAFKA_LOGIN_MODULE:org.apache.kafka.common.security.scram.ScramLoginModule}
spring.kafka.jaas.control-flag=required
spring.kafka.jaas.options.username=${KAFKA_USERNAME}
spring.kafka.jaas.options.password=${KAFKA_PASSWORD}

# Certificado CA de Aiven, como archivo PEM
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH}